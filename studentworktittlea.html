<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細頁面 - 菜菜樂園與作品集</title>
    <style>
        /* === 綠色文青風色系與全域樣式 === */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f4; /* 柔和的植物灰綠背景 */
            color: #2c4a3e; /* 深墨綠色主文字 */
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }

        /* 頂部導覽列 / 返回首頁按鈕區 */
        .navbar {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 10px 20px;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #3b554b;
            background-color: #ffffff;
            border: 1px solid #d2ded7;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(59, 85, 75, 0.05);
        }

        .back-home-btn:hover {
            background-color: #3b554b;
            color: #ffffff;
            border-color: #3b554b;
            transform: translateY(-2px);
        }

        /* === 主要內容卡片容器 === */
        .container {
            max-width: 900px;
            margin: 20px auto 60px auto;
            background: #ffffff;
            padding: 45px;
            border-radius: 12px;
            border: 1px solid #e2ebe5;
            box-shadow: 0 4px 20px rgba(59, 85, 75, 0.04);
        }

        /* 標題與標籤樣式 */
        .project-header h1 {
            font-size: 2.2rem;
            color: #2c4a3e;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .project-category {
            display: inline-block;
            background-color: #eaf1ed; /* 淺草綠標籤背景 */
            color: #3b554b;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* 作品展示圖片/影片區塊 */
        .project-media {
            width: 100%;
            height: 400px;
            background-color: #f7faf8;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7d9a8c;
            font-size: 1rem;
            margin-bottom: 35px;
            border: 2px dashed #b8ccc2; /* 柔和的綠色虛線框 */
        }

        .project-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
/* 圖片輪播外框容器 */
        .project-media-slider {
            position: relative;
            width: 100%;
            height: 420px;
            background-color: #f7faf8;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 35px;
            border: 1px solid #d2ded7;
            box-shadow: 0 2px 8px rgba(59, 85, 75, 0.04);
        }

        .slider-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 圖片預設隱藏，只有帶有 active 的會顯示 */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 確保圖片不變形完整呈現，若要填滿可改為 cover */
            background-color: #f0f4f1;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 左右切換按鈕樣式（文青深綠色風格） */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(59, 85, 75, 0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
        }

        .slider-btn:hover {
            background-color: #2c4a3e;
            transform: translateY(-50%) scale(1.05);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        /* 圖片計數器（右下角顯示目前第幾張） */
        .slider-counter {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background-color: rgba(44, 74, 62, 0.75);
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            z-index: 10;
        }

        /* 文章段落排版 */
        .project-content h2 {
            font-size: 1.35rem;
            color: #2c4a3e;
            margin-top: 35px;
            border-bottom: 2px solid #eaf1ed;
            padding-bottom: 8px;
        }

        .project-content p {
            color: #4a5c53;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        /* 外部連結按鈕 */
        .action-links {
            margin-top: 45px;
            padding-top: 25px;
            border-top: 1px solid #eaf1ed;
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background-color: #3b554b; /* 文青深綠色按鈕 */
            color: white;
            padding: 10px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 2px 6px rgba(59, 85, 75, 0.15);
        }

        .btn-primary:hover {
            background-color: #2c4a3e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 頂部返回首頁導覽列 -->
    <div class="navbar">
        <a href="studentwork.html" class="back-home-btn">← 返回首頁 / Back to Home</a>
    </div>

    <!-- 主要作品內容區 -->
    <main class="container">
        <div class="project-header">
            <span class="project-category">菜菜樂園 / 原創 IP 專案</span>
            <h1>番茄淘米 (Tommy) 與蔬菜夥伴的奇幻冒險</h1>
        </div>

	<!-- 圖片輪播展示區域 -->
        <div class="project-media-slider">
            <div class="slider-container">
                <!-- 圖片列表：請將 src 替換成你的作品圖片網址 -->
                <img src="graph/tommy/1.jpg" alt="作品圖片 1" class="slide active">
                <img src="graph/tommy/2.jpg" alt="作品圖片 2" class="slide">
                <img src="graph/tommy/3.jpg.jpg" alt="作品圖片 3" class="slide">
            </div>
            
            <!-- 左右切換按鈕 -->
            <button class="slider-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
            <button class="slider-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
            
            <!-- 圖片頁碼指示器（例如：1 / 3） -->
            <div class="slider-counter">
                <span id="current-index">1</span> / <span id="total-slides">3</span>
            </div>
        </div>

            <h2>作品理念與背景</h2>
            <p>這裡可以詳細描述你的創作初衷。例如：「菜菜樂園」是由番茄化身而成的原創角色 <strong>Tommy（淘米）</strong> 所展開的世界觀。名稱取自 Tomato 與 To Me，象徵著尋找自我與自我療癒的過程...</p>

            <h2>設計細節與特色</h2>
            <p>在這裡分享你的排版過程、繪圖軟體（如 Krita、Affinity Designer）的使用心得，或是角色設定的草圖與色彩搭配邏輯。</p>

            <h2>相關連結</h2>
            <div class="action-links">
                <a href="https://line.me" target="_blank" class="btn-primary">查看 LINE 貼圖 / 外部連結</a>
            </div>
        </div>
    </main>

</body>
</html>
